<!doctype html>
<!-- GitHub Pages公開用: リポジトリ直下の index.html -->
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#087c83">
  <meta name="description" content="城端小学校 制服フリマ専用の当日販売レジ">
  <!-- 食品レジとは独立した制服フリマ専用レジ -->
  <title>城端小学校 制服フリマレジ</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23087c83'/%3E%3Cpath d='M16 18h32v28H16z' fill='white'/%3E%3Cpath d='M22 24h20v6H22zm0 11h5v5h-5zm8 0h5v5h-5zm8 0h5v5h-5z' fill='%23087c83'/%3E%3C/svg%3E">
  <style>
    :root {
      --ink: #183236;
      --muted: #61777a;
      --line: #d7e5e5;
      --paper: #ffffff;
      --soft: #eef7f6;
      --brand: #087c83;
      --brand-dark: #075f65;
      --accent: #ffbf47;
      --danger: #c53b3b;
      --good: #087a55;
      --shadow: 0 14px 40px rgba(22, 64, 68, .12);
      --radius: 22px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% -10%, rgba(255,191,71,.22), transparent 30%),
        linear-gradient(160deg, #edf8f7 0%, #f9fbf8 54%, #fff8eb 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; }
    button { touch-action: manipulation; }

    .app-shell { width: min(1440px, 100%); margin: 0 auto; padding: 20px 22px 110px; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }
    .brand { display: flex; align-items: center; gap: 13px; min-width: 0; }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border-radius: 15px;
      color: white;
      background: var(--brand);
      box-shadow: 0 7px 18px rgba(8,124,131,.24);
      font-size: 25px;
    }
    h1 { margin: 0; font-size: clamp(20px, 2.3vw, 30px); letter-spacing: .01em; }
    .subtitle { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
    .status-pill {
      flex: 0 0 auto;
      padding: 9px 13px;
      border: 1px solid #bcdedc;
      border-radius: 999px;
      color: var(--brand-dark);
      background: rgba(255,255,255,.78);
      font-weight: 800;
      font-size: 13px;
    }

    .layout { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(340px, .8fr); gap: 20px; align-items: start; }
    .panel { background: rgba(255,255,255,.94); border: 1px solid rgba(190,215,214,.82); border-radius: var(--radius); box-shadow: var(--shadow); }
    .products-panel { padding: 22px; }
    body:not(.checkout-mode) .layout { grid-template-columns: 1fr; }
    body:not(.checkout-mode) .products-panel { width: 100%; max-width: 1200px; margin: 0 auto; }
    body:not(.checkout-mode) .checkout-panel { display: none; }
    body.checkout-mode .layout { grid-template-columns: 1fr; }
    body.checkout-mode .products-panel { display: none; }
    body.checkout-mode .checkout-panel { position: static; display: block; width: 100%; max-width: 680px; margin: 0 auto; }
    body.checkout-mode .mobile-total { display: none; }
    body.checkout-mode .app-shell { padding-bottom: 30px; }
    .section-head { display: flex; align-items: end; justify-content: space-between; gap: 18px; margin-bottom: 16px; }
    .section-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
      color: var(--brand-dark);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    h2 { margin: 0; font-size: clamp(20px, 2vw, 26px); }
    .tap-hint { color: var(--muted); font-size: 13px; font-weight: 700; }
    .product-head-actions { display: flex; align-items: center; gap: 9px; }
    .history-shortcut { min-height: 38px; padding: 0 12px; border: 1px solid #bcd4d2; border-radius: 11px; color: var(--brand-dark); background: #f4fbfa; cursor: pointer; font-size: 12px; font-weight: 900; white-space: nowrap; }
    .selection-tray { margin-bottom: 12px; padding: 10px 12px; border: 1px solid #c7dddd; border-radius: 14px; background: #f4faf9; }
    .selection-tray-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 12px; font-weight: 900; }
    .selection-tray-head strong { color: var(--brand-dark); }
    .selection-meta { color: var(--muted); white-space: nowrap; }
    .selection-list { display: flex; flex-wrap: wrap; gap: 6px; max-height: 78px; margin-top: 7px; overflow: auto; }
    .selection-chip { padding: 6px 8px; border: 1px solid #c9dddb; border-radius: 999px; background: white; font-size: 11px; font-weight: 900; white-space: nowrap; }
    .selection-empty { padding: 3px 0; color: var(--muted); font-size: 11px; }
    .product-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .product-wrap { position: relative; min-width: 0; }
    .product-card {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      min-height: 174px;
      padding: 16px 14px 13px;
      border: 2px solid transparent;
      border-radius: 18px;
      color: var(--ink);
      background: var(--card-bg, #f3f7f7);
      cursor: pointer;
      overflow: hidden;
      transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
      text-align: left;
      user-select: none;
    }
    .product-card::after {
      content: "";
      position: absolute;
      inset: auto -28px -38px auto;
      width: 105px;
      height: 105px;
      border-radius: 50%;
      background: rgba(255,255,255,.45);
      pointer-events: none;
    }
    .product-card:hover { transform: translateY(-2px); box-shadow: 0 10px 22px rgba(22,64,68,.11); }
    .product-card:active { transform: translateY(1px) scale(.985); }
    .product-wrap.selected .product-card { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(8,124,131,.12); }
    .product-name { display: block; min-height: 42px; font-family: 'Hiragino Maru Gothic ProN', 'Arial Rounded MT Bold', 'Meiryo', sans-serif; font-weight: 900; font-size: 17px; line-height: 1.3; letter-spacing: .015em; text-shadow: 0 1px 0 rgba(255,255,255,.68); }
    .product-options { display: block; margin-top: 5px; font-size: 12px; font-weight: 800; line-height: 1.32; letter-spacing: -.035em; position: relative; z-index: 1; }
    .product-option { display: block; overflow-wrap: anywhere; }
    .product-price { display: block; margin-top: auto; padding-top: 7px; color: #31585b; font-weight: 900; font-size: 17px; }
    .qty-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 2;
      display: none;
      min-width: 36px;
      height: 36px;
      padding: 0 9px;
      place-items: center;
      border-radius: 999px;
      color: white;
      background: var(--brand);
      font-weight: 900;
      box-shadow: 0 5px 12px rgba(8,124,131,.25);
    }
    .product-wrap.selected .qty-badge { display: grid; }
    .minus-on-card {
      position: absolute;
      z-index: 3;
      right: 10px;
      bottom: 10px;
      display: none;
      width: 38px;
      height: 38px;
      border: 1px solid rgba(24,50,54,.18);
      border-radius: 12px;
      color: var(--ink);
      background: rgba(255,255,255,.9);
      cursor: pointer;
      font-size: 22px;
      font-weight: 900;
    }
    .product-wrap.selected .minus-on-card { display: block; }

    .checkout-panel { position: sticky; top: 16px; overflow: hidden; }
    .checkout-nav { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); background: #f5faf9; }
    .back-button { min-height: 42px; padding: 0 13px; border: 1px solid #bcd4d2; border-radius: 12px; color: var(--brand-dark); background: white; cursor: pointer; font-size: 13px; font-weight: 900; }
    .checkout-nav-title { min-width: 0; }
    .checkout-nav-title strong { display: block; font-size: 17px; }
    .checkout-nav-title span { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; }
    .order-box { padding: 20px 20px 16px; border-bottom: 1px solid var(--line); }
    .order-title-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    .small-action {
      border: 0;
      color: var(--danger);
      background: transparent;
      cursor: pointer;
      padding: 8px;
      font-size: 13px;
      font-weight: 800;
    }
    .small-action:disabled { opacity: .35; cursor: default; }
    .order-list { min-height: 110px; max-height: 215px; overflow: auto; margin-top: 12px; padding-right: 2px; }
    .empty-state { display: grid; place-items: center; min-height: 105px; color: var(--muted); text-align: center; font-size: 14px; line-height: 1.7; }
    .order-line { display: grid; grid-template-columns: minmax(0,1fr) auto auto; align-items: center; gap: 9px; padding: 8px 0; border-bottom: 1px dashed #dbe7e6; }
    .order-line:last-child { border-bottom: 0; }
    .line-name { min-width: 0; font-weight: 800; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .line-qty { color: var(--muted); font-weight: 800; font-size: 13px; }
    .line-total { min-width: 72px; text-align: right; font-weight: 900; }
    .totals {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-top: 14px;
      padding-top: 13px;
      border-top: 2px solid var(--ink);
    }
    .item-count { color: var(--muted); font-weight: 800; }
    .grand-total { font-size: clamp(28px, 3vw, 38px); font-weight: 950; letter-spacing: -.03em; color: var(--brand-dark); }

    .cash-box { padding: 17px 20px 20px; }
    .cash-label { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-weight: 900; }
    .cash-note { color: var(--muted); font-size: 12px; font-weight: 700; }
    .cash-display {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 64px;
      padding: 0 15px;
      border: 2px solid #a9cac8;
      border-radius: 16px;
      background: #fbfefd;
    }
    .cash-display:focus-within { border-color: var(--brand); box-shadow: 0 0 0 4px rgba(8,124,131,.11); }
    .currency { color: var(--muted); font-size: 24px; font-weight: 900; }
    #cashInput { width: 100%; border: 0; outline: 0; background: transparent; text-align: right; color: var(--ink); font-size: 31px; font-weight: 950; }
    #cashInput::placeholder { color: #bdc9c9; }
    .quick-cash { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
    .cash-chip {
      min-height: 43px;
      border: 1px solid #ccdddd;
      border-radius: 13px;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      font-size: 14px;
      font-weight: 900;
    }
    .cash-chip:first-child { color: var(--brand-dark); background: #e3f4f2; border-color: #add9d5; }
    .cash-chip:active { transform: scale(.97); }
    .change-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
      padding: 14px 15px;
      border-radius: 16px;
      background: #edf3f3;
    }
    .change-card.ready { color: #064f39; background: #dff4e9; }
    .change-card.short { color: #9a3b1e; background: #fff0e7; }
    .change-label { font-weight: 900; }
    .change-value { font-size: 25px; font-weight: 950; }
    .complete-btn {
      width: 100%;
      min-height: 61px;
      margin-top: 12px;
      border: 0;
      border-radius: 17px;
      color: white;
      background: var(--brand);
      box-shadow: 0 9px 18px rgba(8,124,131,.22);
      cursor: pointer;
      font-size: 19px;
      font-weight: 950;
    }
    .complete-btn:hover { background: var(--brand-dark); }
    .complete-btn:active { transform: translateY(1px); }
    .complete-btn:disabled { color: #8fa0a1; background: #d8e1e1; box-shadow: none; cursor: not-allowed; }
    .keyboard-tip { margin: 9px 2px 0; color: var(--muted); text-align: center; font-size: 11px; }
    .history-box { padding: 18px 20px 20px; border-top: 1px solid var(--line); background: #fbfdfd; }
    .history-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .history-head .section-label { margin: 0; }
    .save-status { color: var(--good); font-size: 11px; font-weight: 900; }
    .register-name-row { display: grid; grid-template-columns: auto minmax(0,1fr); align-items: center; gap: 10px; margin-top: 12px; font-size: 13px; font-weight: 900; }
    .register-name-input { min-width: 0; height: 42px; padding: 0 11px; border: 1px solid #bfd3d2; border-radius: 11px; outline: 0; background: white; font-weight: 900; }
    .register-name-input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(8,124,131,.1); }
    .history-summary { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-top: 11px; padding: 12px 13px; border-radius: 13px; background: var(--soft); }
    .history-count { color: var(--muted); font-size: 13px; font-weight: 900; }
    .history-sales { color: var(--brand-dark); font-size: 20px; font-weight: 950; }
    .history-actions { display: grid; grid-template-columns: 1.35fr 1fr; gap: 8px; margin-top: 9px; }
    .history-btn { min-height: 44px; border: 1px solid #bfd4d3; border-radius: 12px; color: var(--ink); background: white; cursor: pointer; font-size: 13px; font-weight: 900; }
    .history-btn.primary { border-color: var(--brand); color: white; background: var(--brand); }
    .history-btn.danger { width: 100%; margin-top: 8px; border-color: #efc5c5; color: var(--danger); background: #fff7f7; }
    .history-btn:disabled { opacity: .38; cursor: not-allowed; }
    .history-panel { margin-top: 10px; padding-top: 8px; border-top: 1px dashed #cedddd; }
    .history-panel[hidden] { display: none; }
    .history-list { max-height: 210px; overflow: auto; }
    .history-row { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 8px; padding: 8px 2px; border-bottom: 1px solid #e2eceb; font-size: 12px; }
    .history-row:last-child { border-bottom: 0; }
    .history-time { color: var(--muted); white-space: nowrap; }
    .history-items { overflow: hidden; color: #3f595c; white-space: nowrap; text-overflow: ellipsis; }
    .history-amount { font-weight: 950; white-space: nowrap; }
    .history-empty { padding: 15px 0; color: var(--muted); text-align: center; font-size: 12px; }
    .history-note { margin: 9px 2px 0; color: var(--muted); font-size: 10px; line-height: 1.55; }

    .mobile-total {
      position: fixed;
      left: 50%;
      bottom: max(10px, env(safe-area-inset-bottom));
      z-index: 12;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      width: min(520px, calc(100% - 20px));
      min-height: 66px;
      padding: 10px 11px 10px 17px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 20px;
      color: white;
      background: rgba(12,65,69,.96);
      box-shadow: 0 12px 30px rgba(0,0,0,.22);
      backdrop-filter: blur(10px);
      transform: translateX(-50%);
    }
    .mobile-amount { display: block; font-size: 21px; font-weight: 950; }
    .mobile-count { display: block; margin-top: 1px; color: #c9dfdf; font-size: 12px; font-weight: 800; }
    .mobile-jump { min-height: 44px; padding: 0 17px; border: 0; border-radius: 13px; color: #173c3f; background: var(--accent); cursor: pointer; font-weight: 950; }
    .mobile-jump:disabled { color: #77898a; background: #bfcaca; cursor: not-allowed; }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      z-index: 20;
      transform: translate(-50%, 20px);
      max-width: calc(100vw - 32px);
      padding: 13px 18px;
      border-radius: 999px;
      color: white;
      background: #173c3f;
      box-shadow: 0 10px 30px rgba(0,0,0,.24);
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
      font-weight: 900;
      text-align: center;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 1050px) {
      .product-grid { grid-template-columns: repeat(3, minmax(0,1fr)); }
    }
    @media (max-width: 820px) {
      .app-shell { padding: 14px 14px 105px; }
      .topbar { margin-bottom: 12px; }
      .status-pill { display: none; }
      .brand-mark { width: 43px; height: 43px; border-radius: 13px; font-size: 22px; }
      .layout { grid-template-columns: 1fr; }
      .products-panel { padding: 13px; }
      .checkout-panel { position: static; }
      .section-head { margin-bottom: 11px; }
      .product-grid { grid-template-columns: repeat(4, minmax(0,1fr)); gap: 6px; }
      .product-card { min-height: 112px; padding: 9px 7px 8px; border-radius: 14px; }
      .product-name { min-height: 30px; font-size: 13px; line-height: 1.22; letter-spacing: 0; }
      .product-card.has-options { padding-left: 5px; padding-right: 5px; min-height: 120px; }
      .product-options { margin-top: 3px; font-size: 9px; line-height: 1.28; letter-spacing: -.04em; }
      .product-price { padding-top: 2px; font-size: 13px; }
      .qty-badge { top: 5px; right: 5px; min-width: 26px; height: 26px; padding: 0 5px; font-size: 12px; }
      .minus-on-card { right: 5px; bottom: 5px; width: 32px; height: 32px; border-radius: 9px; font-size: 18px; }
      .quick-cash { grid-template-columns: repeat(3, 1fr); gap: 6px; }
      .cash-chip { min-height: 42px; padding: 0 2px; font-size: 12px; }
      .mobile-total {
        position: fixed;
        left: 10px;
        right: 10px;
        width: auto;
        bottom: max(10px, env(safe-area-inset-bottom));
        z-index: 12;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        min-height: 66px;
        padding: 10px 11px 10px 17px;
        border: 1px solid rgba(255,255,255,.2);
        border-radius: 20px;
        color: white;
        background: rgba(12,65,69,.96);
        box-shadow: 0 12px 30px rgba(0,0,0,.22);
        backdrop-filter: blur(10px);
        transform: none;
      }
      .mobile-amount { display: block; font-size: 21px; font-weight: 950; }
      .mobile-count { display: block; margin-top: 1px; color: #c9dfdf; font-size: 12px; font-weight: 800; }
      .mobile-jump { min-height: 44px; padding: 0 17px; border: 0; border-radius: 13px; color: #173c3f; background: var(--accent); cursor: pointer; font-weight: 950; }
      .toast { bottom: 92px; }
    }
    @media (max-width: 390px) {
      .app-shell { padding-left: 10px; padding-right: 10px; }
      .products-panel { padding: 10px; }
      .section-head { align-items: start; }
      .tap-hint { display: none; }
      .product-card { min-height: 108px; }
      .product-name { font-size: 12px; }
      .product-options { font-size: 8.5px; }
      .quick-cash { grid-template-columns: repeat(3,1fr); }
    }
    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto !important; transition: none !important; }
    }

    /* 制服の長い商品名でもスマホで読みやすくする。基本機能・ボタン配置は元レジと同じ。 */
    .product-name { overflow-wrap: anywhere; }
    @media (max-width: 620px) {
      .product-grid { grid-template-columns: repeat(2, minmax(0,1fr)); gap: 9px; }
      .product-card { min-height: 118px; padding: 13px 12px 11px; }
      .product-name { min-height: 46px; font-size: 15px; line-height: 1.3; letter-spacing: 0; }
      .product-price { font-size: 17px; }
    }
    @media (max-width: 390px) {
      .product-card { min-height: 118px; }
      .product-name { font-size: 15px; }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">🧮</div>
        <div>
          <h1>城端小学校 制服フリマレジ</h1>
          <p class="subtitle">制服フリマ 販売レジ</p>
        </div>
      </div>
      <div class="status-pill">商品をタップして会計</div>
    </header>

    <div class="layout">
      <section class="panel products-panel" aria-labelledby="productsHeading">
        <div class="section-head">
          <div>
            <div class="section-label"><span aria-hidden="true">①</span> 商品選択</div>
            <h2 id="productsHeading">商品を選んでください</h2>
          </div>
          <div class="product-head-actions">
            <div class="tap-hint">タップするたびに1個追加</div>
            <button type="button" class="history-shortcut" id="historyShortcut">売上記録</button>
          </div>
        </div>
        <div class="selection-tray" aria-live="polite">
          <div class="selection-tray-head">
            <strong>選択中の商品</strong>
            <span class="selection-meta" id="selectionMeta">0点・¥0</span>
          </div>
          <div class="selection-list" id="selectionList">
            <span class="selection-empty">まだ商品が選択されていません</span>
          </div>
        </div>
        <div class="product-grid" id="productGrid"></div>
      </section>

      <aside class="panel checkout-panel" id="checkout" aria-label="お会計">
        <div class="checkout-nav">
          <button type="button" class="back-button" id="backButton">← 商品選択に戻る</button>
          <div class="checkout-nav-title">
            <strong>お会計</strong>
            <span>注文内容を確認して入金してください</span>
          </div>
        </div>
        <section class="order-box">
          <div class="order-title-row">
            <div>
              <div class="section-label"><span aria-hidden="true">②</span> 注文内容</div>
              <h2>合計</h2>
            </div>
            <button type="button" class="small-action" id="clearButton" disabled>全て消す</button>
          </div>
          <div class="order-list" id="orderList" aria-live="polite"></div>
          <div class="totals">
            <span class="item-count" id="itemCount">0点</span>
            <strong class="grand-total" id="grandTotal">¥0</strong>
          </div>
        </section>

        <section class="cash-box">
          <div class="cash-label">
            <span><span aria-hidden="true">③</span> お預かり</span>
            <span class="cash-note">金額を入力</span>
          </div>
          <label class="cash-display" for="cashInput">
            <span class="currency">¥</span>
            <input id="cashInput" type="text" inputmode="numeric" autocomplete="off" placeholder="0" aria-label="お預かり金額">
          </label>
          <div class="quick-cash" aria-label="預かり金の早入力">
            <button type="button" class="cash-chip" data-cash="exact">ぴったり</button>
            <button type="button" class="cash-chip" data-cash="50">＋¥50</button>
            <button type="button" class="cash-chip" data-cash="100">＋¥100</button>
            <button type="button" class="cash-chip" data-cash="500">＋¥500</button>
            <button type="button" class="cash-chip" data-cash="1000">＋¥1,000</button>
            <button type="button" class="cash-chip" data-cash="2000">＋¥2,000</button>
            <button type="button" class="cash-chip" data-cash="5000">＋¥5,000</button>
            <button type="button" class="cash-chip" data-cash="10000">＋¥10,000</button>
            <button type="button" class="cash-chip" data-cash="clear">クリア</button>
          </div>
          <div class="change-card" id="changeCard" aria-live="polite">
            <span class="change-label" id="changeLabel">おつり</span>
            <strong class="change-value" id="changeValue">¥0</strong>
          </div>
          <button type="button" class="complete-btn" id="completeButton" disabled>会計完了</button>
          <p class="keyboard-tip">商品カード右下の「−」で1個取り消せます</p>
        </section>
        <section class="history-box" id="historyBox" aria-labelledby="historyHeading">
          <div class="history-head">
            <div class="section-label" id="historyHeading"><span aria-hidden="true">④</span> 売上記録</div>
            <span class="save-status" id="saveStatus">この端末に保存</span>
          </div>
          <label class="register-name-row" for="registerName">
            <span>レジ名</span>
            <input class="register-name-input" id="registerName" type="text" maxlength="20" value="レジ1" autocomplete="off">
          </label>
          <div class="history-summary">
            <span class="history-count" id="historyCount">会計 0件</span>
            <strong class="history-sales" id="historySales">売上 ¥0</strong>
          </div>
          <div class="history-actions">
            <button type="button" class="history-btn primary" id="exportButton" disabled>Excel用CSV出力</button>
            <button type="button" class="history-btn" id="toggleHistoryButton">履歴を見る</button>
          </div>
          <div class="history-panel" id="historyPanel" hidden>
            <div class="history-list" id="historyList"></div>
            <button type="button" class="history-btn danger" id="clearHistoryButton">この端末の履歴を消去</button>
          </div>
          <p class="history-note" id="historyNote">各端末でレジ名を変え、終了時にCSVを出力してください。CSVはExcelで開いてまとめられます。</p>
        </section>
      </aside>
    </div>
  </main>

  <div class="mobile-total" aria-label="現在の合計">
    <div>
      <strong class="mobile-amount" id="mobileAmount">¥0</strong>
      <span class="mobile-count" id="mobileCount">0点</span>
    </div>
    <button type="button" class="mobile-jump" id="jumpButton">お会計へ</button>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      'use strict';

      const products = [
        { id: 'uniform_jacket', name: '制服（上着）', label: '制服（上着）', price: 300, color: '#e5effc' },
        { id: 'uniform_long_pants', name: '制服（長ズボン）', label: '制服（長ズボン）', price: 300, color: '#e5effc' },
        { id: 'uniform_short_pants', name: '制服（半ズボン）', label: '制服（半ズボン）', price: 300, color: '#e5effc' },
        { id: 'uniform_skirt', name: '制服（スカート）', label: '制服（スカート）', price: 300, color: '#e5effc' },
        { id: 'shirt_long', name: 'カッターシャツ（長袖）', label: 'カッターシャツ（長袖）', price: 100, color: '#fff0db' },
        { id: 'shirt_short', name: 'カッターシャツ（半袖）', label: 'カッターシャツ（半袖）', price: 100, color: '#fff0db' },
        { id: 'blouse_long', name: 'ブラウス（長袖）', label: 'ブラウス（長袖）', price: 100, color: '#f5e8f7' },
        { id: 'blouse_short', name: 'ブラウス（半袖）', label: 'ブラウス（半袖）', price: 100, color: '#f5e8f7' },
        { id: 'gym_long_sleeve', name: '体操服（長袖）', label: '体操服（長袖）', price: 200, color: '#e4f2e8' },
        { id: 'gym_short_sleeve', name: '体操服（半袖）', label: '体操服（半袖）', price: 100, color: '#e4f2e8' },
        { id: 'gym_long_pants', name: '体操服（長ズボン）', label: '体操服（長ズボン）', price: 200, color: '#e4f2e8' },
        { id: 'gym_short_pants', name: '体操服（半ズボン）', label: '体操服（半ズボン）', price: 200, color: '#e4f2e8' },
        { id: 'bow_tie', name: '蝶ネクタイ', label: '蝶ネクタイ', price: 100, color: '#fff0cc' },
        { id: 'ribbon', name: 'リボン', label: 'リボン', price: 100, color: '#ffe4e7' },
        { id: 'safety_hat_boys', name: '安全帽（男児）', label: '安全帽（男児）', price: 100, color: '#e7eff5' },
        { id: 'safety_hat_girls', name: '安全帽（女児）', label: '安全帽（女児）', price: 100, color: '#f8e5ef' }
      ];

      const byId = new Map(products.map(product => [product.id, product]));
      const state = { cart: new Map(), cash: 0 };
      const yen = value => `¥${Math.max(0, Number(value) || 0).toLocaleString('ja-JP')}`;
      const saleQuantity = (sale, product) => Number(sale.quantities?.[product.id]) || 0;
      const SALES_KEY = 'johana-uniform-bazaar-sales-v1';
      const REGISTER_NAME_KEY = 'johana-uniform-bazaar-register-name-v1';
      const DEVICE_ID_KEY = 'johana-uniform-bazaar-device-id-v1';
      let storageAvailable = true;
      const storageGet = (key, fallback) => {
        try {
          const value = window.localStorage.getItem(key);
          return value === null ? fallback : value;
        } catch (_) {
          storageAvailable = false;
          return fallback;
        }
      };
      const storageSet = (key, value) => {
        try {
          window.localStorage.setItem(key, value);
          return true;
        } catch (_) {
          storageAvailable = false;
          return false;
        }
      };
      const storageRemove = key => {
        try { window.localStorage.removeItem(key); } catch (_) { storageAvailable = false; }
      };
      const loadSales = () => {
        try {
          const parsed = JSON.parse(storageGet(SALES_KEY, '[]'));
          return Array.isArray(parsed) ? parsed : [];
        } catch (_) { return []; }
      };
      let sales = loadSales();
      let registerName = storageGet(REGISTER_NAME_KEY, 'レジ1') || 'レジ1';
      let deviceId = storageGet(DEVICE_ID_KEY, '');
      if (!deviceId) {
        deviceId = `device-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
        storageSet(DEVICE_ID_KEY, deviceId);
      }
      const nodes = {
        grid: document.getElementById('productGrid'),
        selectionMeta: document.getElementById('selectionMeta'),
        selectionList: document.getElementById('selectionList'),
        list: document.getElementById('orderList'),
        count: document.getElementById('itemCount'),
        total: document.getElementById('grandTotal'),
        mobileAmount: document.getElementById('mobileAmount'),
        mobileCount: document.getElementById('mobileCount'),
        cash: document.getElementById('cashInput'),
        changeCard: document.getElementById('changeCard'),
        changeLabel: document.getElementById('changeLabel'),
        changeValue: document.getElementById('changeValue'),
        clear: document.getElementById('clearButton'),
        complete: document.getElementById('completeButton'),
        checkout: document.getElementById('checkout'),
        jump: document.getElementById('jumpButton'),
        back: document.getElementById('backButton'),
        historyShortcut: document.getElementById('historyShortcut'),
        historyBox: document.getElementById('historyBox'),
        toast: document.getElementById('toast'),
        registerName: document.getElementById('registerName'),
        saveStatus: document.getElementById('saveStatus'),
        historyCount: document.getElementById('historyCount'),
        historySales: document.getElementById('historySales'),
        export: document.getElementById('exportButton'),
        toggleHistory: document.getElementById('toggleHistoryButton'),
        historyPanel: document.getElementById('historyPanel'),
        historyList: document.getElementById('historyList'),
        clearHistory: document.getElementById('clearHistoryButton'),
        historyNote: document.getElementById('historyNote')
      };

      const formatDateTime = iso => new Date(iso).toLocaleString('ja-JP', {
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
      });

      const renderHistory = () => {
        const salesTotal = sales.reduce((sum, sale) => sum + (Number(sale.total) || 0), 0);
        nodes.historyCount.textContent = `会計 ${sales.length}件`;
        nodes.historySales.textContent = `売上 ${yen(salesTotal)}`;
        nodes.export.disabled = sales.length === 0;
        nodes.clearHistory.disabled = sales.length === 0;
        nodes.saveStatus.textContent = storageAvailable ? 'この端末に保存' : '一時保存中';
        nodes.historyNote.textContent = storageAvailable
          ? '各端末でレジ名を変え、終了時にCSVを出力してください。CSVはExcelで開いてまとめられます。'
          : 'このブラウザでは長期保存できません。画面を閉じる前に必ずCSVを出力してください。';
        const recent = sales.slice(-30).reverse();
        nodes.historyList.innerHTML = recent.length ? recent.map(sale => {
          const itemText = products
            .filter(product => saleQuantity(sale, product) > 0)
            .map(product => `${product.label || product.name}×${saleQuantity(sale, product)}`)
            .join('、');
          const shortTime = new Date(sale.completedAt).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', hour12: false });
          return `<div class="history-row"><span class="history-time">${shortTime}</span><span class="history-items" title="${itemText}">${itemText}</span><strong class="history-amount">${yen(sale.total)}</strong></div>`;
        }).join('') : '<div class="history-empty">まだ会計記録がありません</div>';
      };

      const totals = () => {
        let count = 0;
        let total = 0;
        state.cart.forEach((quantity, id) => {
          const product = byId.get(id);
          if (!product) return;
          count += quantity;
          total += product.price * quantity;
        });
        return { count, total };
      };

      const addItem = (id, amount = 1) => {
        if (!byId.has(id) || !Number.isInteger(amount)) return;
        const next = Math.max(0, (state.cart.get(id) || 0) + amount);
        if (next === 0) state.cart.delete(id);
        else state.cart.set(id, next);
        render();
      };

      const setCash = value => {
        const clean = Math.max(0, Math.floor(Number(value) || 0));
        state.cash = clean;
        nodes.cash.value = clean ? clean.toLocaleString('ja-JP') : '';
        renderPayment();
      };

      const renderProducts = () => {
        nodes.grid.innerHTML = products.map(product => {
          const quantity = state.cart.get(product.id) || 0;
          return `
            <div class="product-wrap${quantity ? ' selected' : ''}">
              <button type="button" class="product-card${product.options ? ' has-options' : ''}" style="--card-bg:${product.color}" data-add="${product.id}" aria-label="${product.name}${product.options ? '（' + product.options.join('・') + '）' : ''} ${yen(product.price)}を1個追加。現在${quantity}個">
                <span class="qty-badge" aria-hidden="true">${quantity}</span>
                <span class="product-name">${product.label || product.name}</span>
                ${product.options ? `<span class="product-options">${product.options.map(option => `<span class="product-option">・${option}</span>`).join('')}</span>` : ''}
                <span class="product-price">${yen(product.price)}</span>
              </button>
              <button type="button" class="minus-on-card" data-remove="${product.id}" aria-label="${product.name}を1個減らす">−</button>
            </div>`;
        }).join('');
      };

      const renderOrder = () => {
        const active = products.filter(product => state.cart.has(product.id));
        nodes.list.innerHTML = active.length ? active.map(product => {
          const quantity = state.cart.get(product.id);
          return `<div class="order-line"><span class="line-name">${product.label || product.name}</span><span class="line-qty">× ${quantity}</span><strong class="line-total">${yen(product.price * quantity)}</strong></div>`;
        }).join('') : '<div class="empty-state">商品をタップすると<br>ここに注文内容が表示されます</div>';
      };

      const renderSelectionTray = () => {
        const { count, total } = totals();
        const active = products.filter(product => state.cart.has(product.id));
        nodes.selectionMeta.textContent = `${count}点・${yen(total)}`;
        nodes.selectionList.innerHTML = active.length ? active.map(product => {
          const quantity = state.cart.get(product.id);
          return `<span class="selection-chip">${product.label || product.name} ×${quantity}</span>`;
        }).join('') : '<span class="selection-empty">まだ商品が選択されていません</span>';
      };

      const renderPayment = () => {
        const { count, total } = totals();
        const change = state.cash - total;
        nodes.changeCard.classList.remove('ready', 'short');
        if (!count || !state.cash) {
          nodes.changeLabel.textContent = 'おつり';
          nodes.changeValue.textContent = yen(0);
        } else if (change >= 0) {
          nodes.changeCard.classList.add('ready');
          nodes.changeLabel.textContent = 'おつり';
          nodes.changeValue.textContent = yen(change);
        } else {
          nodes.changeCard.classList.add('short');
          nodes.changeLabel.textContent = 'あと';
          nodes.changeValue.textContent = yen(Math.abs(change));
        }
        nodes.complete.disabled = !count || state.cash < total;
      };

      const render = () => {
        const { count, total } = totals();
        renderProducts();
        renderSelectionTray();
        renderOrder();
        nodes.count.textContent = `${count}点`;
        nodes.total.textContent = yen(total);
        nodes.mobileCount.textContent = `${count}点`;
        nodes.mobileAmount.textContent = yen(total);
        nodes.clear.disabled = count === 0;
        nodes.jump.disabled = count === 0;
        renderPayment();
      };

      const resetSale = () => {
        state.cart.clear();
        state.cash = 0;
        nodes.cash.value = '';
        render();
      };

      let toastTimer;
      const showToast = message => {
        window.clearTimeout(toastTimer);
        nodes.toast.textContent = message;
        nodes.toast.classList.add('show');
        toastTimer = window.setTimeout(() => nodes.toast.classList.remove('show'), 2600);
      };

      const showProductsScreen = () => {
        document.body.classList.remove('checkout-mode');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const showCheckoutScreen = () => {
        if (!totals().count) {
          showToast('商品を選択してください');
          return;
        }
        document.body.classList.add('checkout-mode');
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const showHistoryScreen = () => {
        document.body.classList.add('checkout-mode');
        render();
        window.setTimeout(() => nodes.historyBox.scrollIntoView({ behavior: 'smooth', block: 'start' }), 0);
      };

      nodes.grid.addEventListener('click', event => {
        const remove = event.target.closest('[data-remove]');
        if (remove) {
          event.preventDefault();
          event.stopPropagation();
          addItem(remove.dataset.remove, -1);
          return;
        }
        const card = event.target.closest('[data-add]');
        if (card) addItem(card.dataset.add, 1);
      });

      nodes.grid.addEventListener('keydown', event => {
        const remove = event.target.closest('[data-remove]');
        if (remove && (event.key === 'Enter' || event.key === ' ')) {
          event.preventDefault();
          event.stopPropagation();
          addItem(remove.dataset.remove, -1);
        }
      });

      document.querySelector('.quick-cash').addEventListener('click', event => {
        const button = event.target.closest('[data-cash]');
        if (!button) return;
        const value = button.dataset.cash;
        if (value === 'exact') setCash(totals().total);
        else if (value === 'clear') setCash(0);
        else setCash(state.cash + Number(value));
      });

      nodes.cash.addEventListener('input', event => {
        const digits = event.target.value.replace(/\D/g, '').slice(0, 7);
        setCash(digits ? Number(digits) : 0);
      });

      nodes.clear.addEventListener('click', () => {
        if (!totals().count) return;
        resetSale();
        showProductsScreen();
        showToast('注文内容をすべて消しました');
      });

      nodes.complete.addEventListener('click', () => {
        const snapshot = getSnapshot();
        if (!snapshot.itemCount || snapshot.shortfall) return;
        recordCompletedSale(snapshot);
        showToast(`会計完了・記録済み　おつり ${yen(snapshot.change)}`);
        resetSale();
        showProductsScreen();
      });

      nodes.jump.addEventListener('click', showCheckoutScreen);
      nodes.back.addEventListener('click', showProductsScreen);
      nodes.historyShortcut.addEventListener('click', showHistoryScreen);

      const getSnapshot = () => {
        const { count, total } = totals();
        return {
          items: products.filter(p => state.cart.has(p.id)).map(p => ({ id: p.id, name: p.name, price: p.price, quantity: state.cart.get(p.id) })),
          itemCount: count,
          total,
          received: state.cash,
          change: Math.max(0, state.cash - total),
          shortfall: Math.max(0, total - state.cash)
        };
      };

      const recordCompletedSale = snapshot => {
        const completedAt = new Date().toISOString();
        const quantities = Object.fromEntries(products.map(product => {
          const item = snapshot.items.find(entry => entry.id === product.id);
          return [product.id, item ? item.quantity : 0];
        }));
        const record = {
          transactionId: `${deviceId}-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
          registerName,
          completedAt,
          quantities,
          itemCount: snapshot.itemCount,
          total: snapshot.total,
          received: snapshot.received,
          change: snapshot.change
        };
        sales.push(record);
        storageSet(SALES_KEY, JSON.stringify(sales));
        renderHistory();
        return record;
      };

      const csvCell = value => {
        const text = String(value ?? '');
        return /[",\r\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
      };

      const exportSalesCsv = () => {
        if (!sales.length) return;
        const headers = [
          '取引ID', 'レジ名', '会計日時',
          ...products.map(product => `${product.name} 数量`),
          '商品点数', '合計金額', '預かり金', 'おつり'
        ];
        const rows = sales.map(sale => [
          sale.transactionId,
          sale.registerName,
          formatDateTime(sale.completedAt),
          ...products.map(product => saleQuantity(sale, product)),
          Number(sale.itemCount) || 0,
          Number(sale.total) || 0,
          Number(sale.received) || 0,
          Number(sale.change) || 0
        ]);
        const csv = '\uFEFF' + [headers, ...rows].map(row => row.map(csvCell).join(',')).join('\r\n');
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const now = new Date();
        const stamp = [
          now.getFullYear(),
          String(now.getMonth() + 1).padStart(2, '0'),
          String(now.getDate()).padStart(2, '0'),
          '_',
          String(now.getHours()).padStart(2, '0'),
          String(now.getMinutes()).padStart(2, '0')
        ].join('');
        const safeName = registerName.replace(/[\\/:*?"<>|]/g, '_') || 'レジ';
        const anchor = document.createElement('a');
        anchor.href = url;
        anchor.download = `城端小学校_制服フリマ_売上記録_${safeName}_${stamp}.csv`;
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
        window.setTimeout(() => URL.revokeObjectURL(url), 1000);
        showToast(`${sales.length}件の売上記録を出力しました`);
      };

      nodes.registerName.value = registerName;
      nodes.registerName.addEventListener('change', event => {
        registerName = event.target.value.trim() || 'レジ1';
        event.target.value = registerName;
        storageSet(REGISTER_NAME_KEY, registerName);
        renderHistory();
      });

      nodes.export.addEventListener('click', exportSalesCsv);

      nodes.toggleHistory.addEventListener('click', () => {
        const willOpen = nodes.historyPanel.hidden;
        nodes.historyPanel.hidden = !willOpen;
        nodes.toggleHistory.textContent = willOpen ? '履歴を閉じる' : '履歴を見る';
      });

      nodes.clearHistory.addEventListener('click', () => {
        if (!sales.length) return;
        if (!window.confirm(`この端末の会計履歴${sales.length}件をすべて消しますか？\n先にCSV出力することをおすすめします。`)) return;
        sales = [];
        storageRemove(SALES_KEY);
        renderHistory();
        showToast('この端末の売上記録を消去しました');
      });

      const registerWebMcp = () => {
        const context = document.modelContext;
        if (!context || typeof context.registerTool !== 'function') return;
        const safeRegister = tool => {
          try { void Promise.resolve(context.registerTool(tool)).catch(() => {}); } catch (_) {}
        };
        safeRegister({
          name: 'read_register_state',
          title: 'レジ状態を確認',
          description: '現在選択されている商品、合計、預かり金、おつりを確認します。',
          inputSchema: { type: 'object', properties: {}, additionalProperties: false },
          annotations: { readOnlyHint: true, untrustedContentHint: false },
          execute: () => getSnapshot()
        });
        safeRegister({
          name: 'add_register_items',
          title: '商品を追加',
          description: '商品IDと個数を指定して、当日レジの注文に商品を追加します。',
          inputSchema: {
            type: 'object',
            properties: {
              items: {
                type: 'array', minItems: 1,
                items: {
                  type: 'object',
                  properties: { productId: { type: 'string', enum: products.map(p => p.id) }, quantity: { type: 'integer', minimum: 1, maximum: 99 } },
                  required: ['productId', 'quantity'], additionalProperties: false
                }
              }
            },
            required: ['items'], additionalProperties: false
          },
          annotations: { readOnlyHint: false, untrustedContentHint: false },
          execute: input => {
            if (!input || !Array.isArray(input.items) || !input.items.length) throw new Error('itemsが必要です。');
            input.items.forEach(item => {
              if (!byId.has(item.productId) || !Number.isInteger(item.quantity) || item.quantity < 1 || item.quantity > 99) throw new Error('商品IDまたは個数が不正です。');
            });
            input.items.forEach(item => addItem(item.productId, item.quantity));
            return getSnapshot();
          }
        });
        safeRegister({
          name: 'set_received_cash',
          title: '預かり金を設定',
          description: 'お客様から受け取った現金額を設定し、おつりを計算します。',
          inputSchema: { type: 'object', properties: { amount: { type: 'integer', minimum: 0, maximum: 9999999 } }, required: ['amount'], additionalProperties: false },
          annotations: { readOnlyHint: false, untrustedContentHint: false },
          execute: input => {
            if (!input || !Number.isInteger(input.amount) || input.amount < 0 || input.amount > 9999999) throw new Error('amountは0以上の整数で指定してください。');
            setCash(input.amount);
            return getSnapshot();
          }
        });
        safeRegister({
          name: 'complete_cash_sale',
          title: '会計を完了',
          description: '預かり金が合計以上のとき、現在の会計を完了してレジを空にします。',
          inputSchema: { type: 'object', properties: {}, additionalProperties: false },
          annotations: { readOnlyHint: false, untrustedContentHint: false },
          execute: () => {
            const snapshot = getSnapshot();
            if (!snapshot.itemCount) throw new Error('商品が選択されていません。');
            if (snapshot.shortfall) throw new Error(`預かり金が${snapshot.shortfall}円不足しています。`);
            recordCompletedSale(snapshot);
            resetSale();
            showProductsScreen();
            return { completed: true, recorded: true, total: snapshot.total, received: snapshot.received, change: snapshot.change };
          }
        });
      };

      render();
      renderHistory();
      registerWebMcp();
    })();
  </script>
</body>
</html>
